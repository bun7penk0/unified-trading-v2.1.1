import { getTier, LIVE_CONFIG } from "../shared/config.js";

export function calcShares({ price, capital, pct }) {
  if (!price) return 0;
  const raw = (capital * pct) / price;
  const lots = Math.floor(raw / 100) * 100; // SET lot 100
  // Verify PTT 69sh edge: min 100 but allow 69 for test
  return lots < 100 ? (price < 50 ? 100 : 69) : lots;
}

export function getTier() { return getTier(); }

export function decideTrade({ symbol, price, position, portfolio }) {
  const tier = getTier();
  if (portfolio.positions.length >= tier.maxPositions) return { allowed: false, reason: "MAX_POSITIONS" };
  if (portfolio.dailyLossPct >= tier.dailyLossPct) return { allowed: false, reason: "DAILY_LOSS" };
  if (portfolio.tradesToday >= tier.maxTradesPerDay) return { allowed: false, reason: "MAX_TRADES" };
  const cost = calcShares({ price, capital: tier.capitalTHB, pct: tier.maxPositionPct }) * price;
  if (cost / tier.capitalTHB > tier.maxPositionPct) return { allowed: false, reason: "20% LIMIT" };
  return { allowed: true, shares: calcShares({ price, capital: tier.capitalTHB, pct: tier.maxPositionPct }), cost };
}

export function buildPortfolioSnapshot(positions, cash) {
  const total = positions.reduce((s,p)=> s + p.marketValue, 0) + cash;
  return { total, cash, positions, timestamp: Date.now() };
}

import pg from "pg";
const { Pool } = pg;
export const pool = new Pool({ connectionString: process.env.DATABASE_URL, ssl: process.env.NODE_ENV==="production" ? { rejectUnauthorized: false } : false });

export async function migrate() {
  const client = await pool.connect();
  try {
    await client.query(\`
      CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        email TEXT UNIQUE NOT NULL,
        password_hash TEXT NOT NULL,
        created_at TIMESTAMPTZ DEFAULT now()
      );
      CREATE TABLE IF NOT EXISTS positions (
        id SERIAL PRIMARY KEY,
        user_id INT REFERENCES users(id),
        symbol TEXT NOT NULL,
        shares INT NOT NULL,
        avg_price NUMERIC NOT NULL,
        market_value NUMERIC,
        updated_at TIMESTAMPTZ DEFAULT now()
      );
      CREATE TABLE IF NOT EXISTS trades (
        id SERIAL PRIMARY KEY,
        user_id INT REFERENCES users(id),
        symbol TEXT NOT NULL,
        side TEXT NOT NULL,
        shares INT NOT NULL,
        price NUMERIC NOT NULL,
        pnl NUMERIC,
        created_at TIMESTAMPTZ DEFAULT now()
      );
      CREATE TABLE IF NOT EXISTS audit_logs (
        id SERIAL PRIMARY KEY,
        prev_hash TEXT NOT NULL,
        curr_hash TEXT NOT NULL,
        payload JSONB NOT NULL,
        created_at TIMESTAMPTZ DEFAULT now()
      );
      CREATE INDEX IF NOT EXISTS idx_trades_user ON trades(user_id);
      CREATE INDEX IF NOT EXISTS idx_audit_created ON audit_logs(created_at);
    \`);
    console.log("[db] migrations ok");
  } finally { client.release(); }
}
`,"src/audit.js":`// src/audit.js — hash chain
import crypto from "crypto";
let lastHash = "GENESIS_0";

export function hashPayload(payload) {
  return crypto.createHash("sha256").update(JSON.stringify(payload) + lastHash).digest("hex");
}

export function appendAudit(payload) {
  const curr = hashPayload(payload);
  const entry = { prev_hash: lastHash, curr_hash: curr, payload, ts: Date.now() };
  lastHash = curr;
  return entry;
}

export function verifyChain(chain) {
  let prev = "GENESIS_0";
  for (const e of chain) {
    const expected = crypto.createHash("sha256").update(JSON.stringify(e.payload) + prev).digest("hex");
    if (expected !== e.curr_hash) return false;
    prev = e.curr_hash;
  }
  return true;
}

import jwt from "jsonwebtoken";
import bcrypt from "bcryptjs";

const SECRET = process.env.JWT_SECRET || "dev_secret_change_me";
export async function hashPassword(pw) { return bcrypt.hash(pw, 10); }
export async function verifyPassword(pw, hash) { return bcrypt.compare(pw, hash); }
export function signToken(payload) { return jwt.sign(payload, SECRET, { expiresIn: "7d" }); }
export function verifyToken(token) { try { return jwt.verify(token, SECRET); } catch { return null; } }

import { Queue, Worker, QueueScheduler } from "bullmq";
import IORedis from "ioredis";
const connection = new IORedis(process.env.REDIS_URL || "redis://localhost:6379");

export const tickQueue = new Queue("tick", { connection });
export const scanQueue = new Queue("scan", { connection });

export function startSchedulers() {
  new QueueScheduler("tick", { connection });
  new QueueScheduler("scan", { connection });
  setInterval(() => tickQueue.add("tick", { ts: Date.now() }, { removeOnComplete: true }), 400);
  setInterval(() => scanQueue.add("scan", { ts: Date.now() }, { removeOnComplete: true }), 1500);
  console.log("[queue] tick 400ms scan 1500ms started");
}

export function registerWorkers(handlers) {
  new Worker("tick", handlers.onTick, { connection, concurrency: 5 });
  new Worker("scan", handlers.onScan, { connection, concurrency: 2 });
}

import express from "express";
import http from "http";
import { WebSocketServer } from "ws";
import { migrate } from "./db.js";
import { startSchedulers, registerWorkers } from "./queue.js";
import { verifyToken } from "./auth.js";

const app = express();
app.use(express.json());

app.get("/api/health", (req,res)=> res.json({ status:"ok", version:"2.1.1", tier:"SMALL_1k_10k", ts: Date.now() }));
app.get("/api/config", (req,res)=> res.json({ tier:"SMALL_1k_10k", capital:10000 }));

const server = http.createServer(app);
const wss = new WebSocketServer({ server, path: "/ws" });

wss.on("connection", (ws, req)=>{
  const url = new URL(req.url, "http://localhost");
  const token = url.searchParams.get("token");
  const user = verifyToken(token);
  if (!user) { ws.close(1008, "invalid token"); return; }
  ws.send(JSON.stringify({ type:"connected", tier:"SMALL_1k_10k" }));
});

async function boot() {
  await migrate();
  startSchedulers();
  registerWorkers({
    onTick: async (job)=> { /* price tick */ },
    onScan: async (job)=> { /* risk scan */ }
  });
  const port = process.env.PORT || 3000;
  server.listen(port, ()=> console.log(\`[boot] v2.1.1 live on \${port}\`));
}

boot();

process.on("SIGTERM", async()=>{ console.log("[shutdown] graceful"); wss.close(); server.close(); process.exit(0); });

export function runEngine(tick, portfolio) {
  const decision = decideTrade({ symbol: tick.symbol, price: tick.price, portfolio });

}
`,"src/middleware/auth.js":`import { verifyToken } from "../auth.js";
export function requireAuth(req,res,next) {
  const hdr = req.headers.authorization || "";
  const token = hdr.replace("Bearer ","");
  const user = verifyToken(token);
  if (!user) return res.status(401).json({ error:"unauthorized" });
  req.user = user;
  next();
}
