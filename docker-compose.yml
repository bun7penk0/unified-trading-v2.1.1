version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    environment: {POSTGRES_USER: trader, POSTGRES_PASSWORD: trader, POSTGRES_DB: trading}
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  app:
    build: .
    environment: {DATABASE_URL: postgres://trader:trader@postgres:5432/trading, REDIS_URL: redis://redis:6379, PORT: 3000, JWT_SECRET: change-me}
    depends_on: [postgres, redis]
    ports: ["3000:3000"]
